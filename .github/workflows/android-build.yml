name: Android build
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alajag-rentals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package editable source
        run: |
          zip -r alajag-rentals-source.zip . \
            -x '.git/*' '*/build/*' '.gradle/*' 'local.properties'
      - name: Upload editable source
        uses: actions/upload-artifact@v4
        with:
          name: alajag-rentals-editable-source
          path: alajag-rentals-source.zip
          if-no-files-found: error
          retention-days: 14
