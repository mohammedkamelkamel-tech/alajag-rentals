name: Android Debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Install SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Package APK and editable project
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/
          zip -r release/alajag-rentals-project.zip . -x ".git/*" "*/build/*" ".gradle/*" "release/*"
          cat > release/README.txt <<'EOF'
          العجاج - الإيجارات
          يحتوي هذا الملف على APK الناتج من البناء الناجح، وملف المشروع الكامل القابل للفتح والتعديل في Android Studio.
          الحد الأدنى: Android 9 (API 28).
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: alajag-rentals-15.10-apk-and-project
          path: release/*
          if-no-files-found: error
